# Zero-cost Blueprint for UniversityLeaders. NOT applied. See docs/DEPLOYMENT.md ("Zero-cost setup").
# Free Render web services (sleep after 15 min idle, 750 instance hours per workspace and month shared with every other
# free service) and Neon free PostgreSQL, which also stores attachment files. Secrets use `sync: false`.
# Independent of the existing "university-leaders-demo" service, which is not touched by this file.
# Paid upgrade: plan: starter, add `preDeployCommand: /app/efbundle`, optionally custom domains (docs/DEPLOYMENT.md §1).

services:
  - type: web
    name: university-leaders-api
    runtime: docker
    region: frankfurt
    plan: free                   # no shell and no pre-deploy command: migrations run from an operator machine
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    autoDeploy: false            # deploy deliberately; never on every push
    healthCheckPath: /health
    # Secret file (dashboard -> Environment -> Secret Files): dataprotection.pfx -> /etc/secrets/dataprotection.pfx
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: PORT
        value: "8080"
      - key: ForwardedHeaders__Enabled
        value: "true"            # Render's proxy is the only entry point (TLS terminated there)
      - key: Auth__SameSite
        value: Lax               # browsers reach the API only through the frontend's same-origin proxy
      - key: Cors__AllowedOrigins__0
        sync: false              # https://university-leaders-web.onrender.com (also used by the hub Origin check)
      - key: RateLimiting__Login__PermitLimit
        value: "30"              # every request arrives from the frontend server's IP, so this limit is shared by all users
      - key: Database__ConnectionString
        sync: false              # Neon direct endpoint: Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: DataProtection__Certificate__Path
        value: /etc/secrets/dataprotection.pfx
      - key: DataProtection__Certificate__Password
        sync: false
      - key: Bootstrap__Token
        sync: false              # set only while creating the first University Leader, then delete it

  - type: web
    name: university-leaders-web
    runtime: node
    region: frankfurt
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -H 0.0.0.0 -p $PORT
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_PROXY_TARGET
        sync: false              # https://university-leaders-api.onrender.com (build time: redeploy after changing)
      - key: NEXT_PUBLIC_API_URL
        sync: false              # this site's own origin: https://university-leaders-web.onrender.com
